<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · FastAPI demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1.25rem; color: #172033; background: #f6f8fc; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    a { color: #174bb3; }
    main { background: white; border: 1px solid #d7deeb; border-radius: 1rem; padding: 2rem; }
    h1 { line-height: 1.2; }
    li { margin: .75rem 0; }
    button { background: #174bb3; color: white; border: 0; border-radius: .4rem; padding: .7rem 1rem; cursor: pointer; font: inherit; }
    button:disabled { opacity: .65; cursor: wait; }
    pre { padding: 1rem; background: #eef2f8; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('page_home') }}">Home</a>
    <a href="{{ url_for('page_welcome') }}">Welcome message</a>
    <a href="{{ url_for('page_health') }}">Server health</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
